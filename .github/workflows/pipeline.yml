name: ETL Pipeline CI/CD

on:
    pull_request:
        branches: [main]

jobs:
    quality:
        name: Code Quality
        runs-on: ubuntu-latest

        steps:
        -   name: Checkout repository
            uses: actions/checkout@v4

        -   name: Set up Python
            uses: actions/setup-python@v5
            with:
                python-version: "3.12"

        -   name: Install dependencies
            run: pip install ".[dev]"

        -   name: Run Ruff
            run: ruff check .

        -   name: Run tests
            run: pytest

        -   name: Build production Docker image
            run: docker build --target production -t open-data-etl-platform:latest .