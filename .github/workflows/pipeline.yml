name: ETL Pipeline CI/CD

on:
    pull_request:
        branches: [main]

    push:
        branches: [main]

jobs:
    quality:
        name: Code Quality
        runs-on: ubuntu-latest

        steps:
        -   name: Checkout repository
            uses: actions/checkout@v4

        -   name: Set up Python
            uses: actions/setup-python@v5
            with:
                python-version: "3.12"

        -   name: Install dependencies
            run: pip install ".[dev]"

        -   name: Run Ruff
            run: ruff check .

        -   name: Run tests
            run: pytest

        -   name: Build production Docker image
            run: docker build --target production -t open-data-etl-platform:latest .


    publish:
        name: Publish Production Docker Image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        needs: quality
        runs-on: ubuntu-latest
        environment: production

        steps:
        -   name: Checkout repository
            uses: actions/checkout@v4

        -   name: Log in to Docker Hub
            uses: docker/login-action@v3
            with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

        -   name: Build and push production Docker image
            uses: docker/build-push-action@v6
            with:
                context: .
                target: production
                push: true
                tags: |
                    ${{ secrets.DOCKERHUB_USERNAME }}/open-data-etl-platform:latest
                    ${{ secrets.DOCKERHUB_USERNAME }}/open-data-etl-platform:${{ github.sha }}