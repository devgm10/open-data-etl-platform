name: ETL Pipeline CI/CD

on:
    pull_request:
        branches: [main]

    push:
        branches: [main]

jobs:
    quality:
        name: Code Quality
        runs-on: ubuntu-latest

        steps:
        -   name: Checkout repository
            uses: actions/checkout@v4

        -   name: Set up Python
            uses: actions/setup-python@v5
            with:
                python-version: "3.12"

        -   name: Install dependencies
            run: pip install ".[dev]"

        -   name: Run Ruff
            run: ruff check .

        -   name: Run tests
            run: pytest

        -   name: Build production Docker image
            run: docker build --target production -t open-data-etl-platform:latest .


    publish:
        name: Publish Docker Image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        needs: quality
        runs-on: ubuntu-latest
        environment: production

        permissions:
            contents: read
            id-token: write

        steps:
        -   name: Checkout repository
            uses: actions/checkout@v4

        -   name: Debug OIDC claims
            uses: actions/github-script@v7
            with:
                script: |
                    const token = await core.getIDToken('sts.amazonaws.com');
                    const payload = JSON.parse(Buffer.from(token.split('.')[1], 'base64').toString());
                    console.log('aud:', payload.aud);
                    console.log('sub:', payload.sub);
                    console.log('repository:', payload.repository);
                    console.log('ref:', payload.ref);
                    console.log('environment:', payload.environment);

        -   name: Configure AWS credentials
            uses: aws-actions/configure-aws-credentials@v4
            with:
                role-to-assume: ${{ vars.AWS_ROLE_ARN }}
                aws-region: ${{ vars.AWS_REGION }}

        -   name: Login to Amazon ECR
            id: login-ecr
            uses: aws-actions/amazon-ecr-login@v2

        -   name: Build and push Docker image
            uses: docker/build-push-action@v6
            with:
                context: .
                target: production
                push: true
                tags: |
                    ${{ steps.login-ecr.outputs.registry }}/open-data-etl-platform/etl:latest
                    ${{ steps.login-ecr.outputs.registry }}/open-data-etl-platform/etl:${{ github.sha }}